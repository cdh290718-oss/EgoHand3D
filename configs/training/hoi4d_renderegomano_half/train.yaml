task_name: train
tags:
- wilor
train: true
test: false
ckpt_path: null
seed: null
DATASETS:
  TRAIN:
    HOI4D-CLEAN-TRAIN:
      WEIGHT: 391003
    RENDEREGOMANO-HALF-TRAIN:
      WEIGHT: 300000
  VAL:
    HOI4D-CLEAN-VAL:
      WEIGHT: 20328
    RENDEREGOMANO-VAL:
      WEIGHT: 11000
  TEST:
    HOI4D-CLEAN-TEST:
      WEIGHT: 23765
    RENDEREGOMANO-TEST:
      WEIGHT: 10600
  MOCAP: FREIHAND-MOCAP
  SUPPRESS_KP_CONF_THRESH: 0.3
  FILTER_NUM_KP: 4
  FILTER_NUM_KP_THRESH: 0.0
  FILTER_REPROJ_THRESH: 0.0
  FILTER_MIN_BBOX_SIZE: 0.0
  SUPPRESS_BETAS_THRESH: 0.0
  SUPPRESS_BAD_POSES: false
  POSES_BETAS_SIMULTANEOUS: false
  BETAS_REG: true
  CONFIG:
    SCALE_FACTOR: 0.3
    ROT_FACTOR: 30
    TRANS_FACTOR: 0.02
    COLOR_SCALE: 0.2
    ROT_AUG_RATE: 0.6
    TRANS_AUG_RATE: 0.5
    DO_FLIP: false
    FLIP_AUG_RATE: 0.0
    EXTREME_CROP_AUG_RATE: 0.0
    EXTREME_CROP_AUG_LEVEL: 1
trainer:
  _target_: pytorch_lightning.Trainer
  default_root_dir: ${paths.output_dir}
  accelerator: gpu
  devices: 4
  deterministic: false
  num_sanity_val_steps: 0
  log_every_n_steps: ${GENERAL.LOG_STEPS}
  val_check_interval: ${GENERAL.VAL_STEPS}
  precision: 16
  max_steps: ${GENERAL.TOTAL_STEPS}
  limit_val_batches: 1
  strategy: ddp_find_unused_parameters_true
  num_nodes: 1
  sync_batchnorm: true
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  training_data_dir: ${oc.env:WILOR_TRAINING_DATA,${paths.root_dir}/../hamer/hamer_training_data}
  log_dir: logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
exp_name: train_hoi4d_clean_renderegomano_half_4gpu_from_wilor_60epoch_bs120_v1
GENERAL:
  RESUME: false
  TOTAL_STEPS: 86376
  LOG_STEPS: 100
  VAL_STEPS: 5000
  CHECKPOINT_STEPS: 5000
  CHECKPOINT_SAVE_TOP_K: 3
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
TRAIN:
  LR: 1.0e-05
  WEIGHT_DECAY: 0.0001
  BATCH_SIZE: 120
  LOSS_REDUCTION: mean
  NUM_TRAIN_SAMPLES: 2
  NUM_TEST_SAMPLES: 64
  POSE_2D_NOISE_RATIO: 0.01
  SMPL_PARAM_NOISE_RATIO: 0.005
MANO:
  DATA_DIR: mano_data
  MODEL_PATH: ${MANO.DATA_DIR}
  GENDER: neutral
  NUM_HAND_JOINTS: 15
  MEAN_PARAMS: ${MANO.DATA_DIR}/mano_mean_params.npz
  CREATE_BODY_POSE: false
EXTRA:
  FOCAL_LENGTH: 5000
  NUM_LOG_IMAGES: 4
  NUM_LOG_SAMPLES_PER_IMAGE: 8
  PELVIS_IND: 0
  INIT_RENDERER: false
MODEL:
  IMAGE_SIZE: 256
  IMAGE_MEAN:
  - 0.485
  - 0.456
  - 0.406
  IMAGE_STD:
  - 0.229
  - 0.224
  - 0.225
  BBOX_SHAPE:
  - 192
  - 256
  PRETRAINED_CKPT: ${oc.env:WILOR_INITIAL_CKPT}
  BACKBONE:
    TYPE: vit
    PRETRAINED_WEIGHTS: ${paths.training_data_dir}/vitpose_backbone.pth
  MANO_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      norm: layer
      context_dim: 1280
LOSS_WEIGHTS:
  KEYPOINTS_3D: 0.05
  KEYPOINTS_2D: 0.01
  GLOBAL_ORIENT: 0.001
  HAND_POSE: 0.001
  BETAS: 0.0005
  ADVERSARIAL: 0.0005
