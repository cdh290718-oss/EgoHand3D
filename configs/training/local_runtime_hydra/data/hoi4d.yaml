# @package _global_

DATASETS:
  TRAIN:
    HOI4D-TRAIN:
      WEIGHT: 1.0
  VAL:
    HOI4D-VAL:
      WEIGHT: 1.0
  TEST:
    HOI4D-TEST:
      WEIGHT: 1.0

  MOCAP: FREIHAND-MOCAP

  SUPPRESS_KP_CONF_THRESH: 0.3
  FILTER_NUM_KP: 4
  FILTER_NUM_KP_THRESH: 0.0
  FILTER_REPROJ_THRESH: 0.0
  FILTER_MIN_BBOX_SIZE: 0.0

  # HOI4D betas can exceed the official low1 threshold, so do not suppress
  # MANO pose/beta supervision for this dataset by default.
  SUPPRESS_BETAS_THRESH: 0.0
  SUPPRESS_BAD_POSES: False
  POSES_BETAS_SIMULTANEOUS: False
