<h1>EgoHand3D</h1><p>基于 WiLoR 的第一视角 RGB 手部姿态估计适配与处理软件。</p>
<p>保留 WiLoR 网络，通过第一视角数据微调，并提供可恢复推理、MANO 导出与校验、时序处理、评估和静态报告。</p>
